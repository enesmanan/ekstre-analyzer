[project]
name = "ekstre-analyzer"
version = "0.1.0"
description = "TOM Bank statement masking CLI"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pymupdf==1.28.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
