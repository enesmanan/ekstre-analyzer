[project]
name = "ekstre-analyzer"
version = "0.1.0"
description = "TOM Bank statement masking CLI"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "google-genai>=2.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf==1.28.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
    "typer>=0.27.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
